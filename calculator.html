<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="project.css">
</head>
<body>
     <a id="one" href="index.html">home</a>
     <div class="calculator">
        <input type="text" id="screen" readonly>
        
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">C</button>
            <button class="clear" onclick="backspace()"> Del</button> 
            <button onclick="press('/')" class="operator">/</button>
            <button onclick="press('*')" class="operator">*</button>
            <button onclick="press('-')" class="operator">-</button>
            
            <button onclick="press('9')">9</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('7')">7</button>
            <button onclick="press('+')" class="operator">+</button>
            
            <button onclick="press('6')">6</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('4')">4</button>
            <button id="equal" onclick="calculate()" style="grid-row: span 2; background-color: #4cd964; color: white;">=</button>
            
            <button onclick="press('3')">3</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('1')">1</button>
            
            <button onclick="press('0')" style="grid-column: span 2;">0</button>
            <button onclick="press('.')">.</button>
        </div>
    </div>

    



    <script>
        let screen = document.getElementById('screen');

        // Button dabane par screen par number dikhane ke liye
        function press(value) {
            screen.value += value;
        }

        // Screen saaf karne ke liye (C button)
        function clearScreen() {
            screen.value = '';
        }
        function backspace() {
    let screen = document.getElementById('screen');
    // .slice(0, -1) स्क्रीन पर लिखे टेक्स्ट का आखिरी अक्षर हटा देगा
    screen.value = screen.value.slice(0, -1);
}


        // Hisab lagane ke liye (= button)
        function calculate() {
            try {
                // eval() function text ko maths ki tarah solve kar deta hai
                screen.value = eval(screen.value);
            } catch (error) {
                screen.value = 'Error';
            }
             
        }
    </script>
</body>
</html>
