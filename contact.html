    <section id="contact-page">
        <div class="contact-header">
            <h2>Get In Touch</h2>
            <p>Aap mujhse niche diye gaye form ya social links ke zariye jud sakte hain.</p>
        </div>

        <div class="contact-container">
            <form class="contact-form" id="main-contact-form">
                <div class="input-group">
                    <label>Your Naam</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="input-group">
                    <label>Your Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label>Message</label>
                    <textarea placeholder="Write your message here..." rows="5" required></textarea>
                </div>
                <button type="submit" class="send-btn">Send Message</button>
            </form>

            <div class="contact-info">
                <h3>Direct Connect</h3>
                <div class="info-item">
                    <span>📍</span> <strong>Location:</strong> 
                </div>
                <div class="info-item">
                    <span>📧</span> <strong>Email:</strong> deepanshj207@gmail.com
                </div>
                
                <div class="social-links-grid">
                    <a href="https://wa.me/yournumber" class="social-card whatsapp">WhatsApp</a>
                    <a href="#" class="social-card linkedin">LinkedIn</a>
                    <a href="#" class="social-card upwork">Upwork Profile</a>
                </div>
            </div>
        </div>
    </section>
